<ion-content [fullscreen]="true" class="login-content" [scrollY]="false">
  <div class="login-wrapper">
    
    <div class="header-section fade-in">
      <div class="brand-container">
        <img src="assets/icon/icon.png" alt="ExpertiMente Logo" class="brand-logo">
        <h1 class="brand-title">ExpertiMente</h1>
      </div>
      <p class="brand-subtitle">Inicia sesión para continuar</p>
    </div>

    <div class="form-container fade-in">
      <form (ngSubmit)="iniciarSesion()">
        
        <div class="input-group">
          <ion-item lines="none" class="custom-input-item">
            <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
            <ion-input
              type="email"
              placeholder="Correo electrónico"
              [(ngModel)]="credenciales.correo"
              name="correo"
              required>
            </ion-input>
          </ion-item>
        </div>

        <div class="input-group">
          <ion-item lines="none" class="custom-input-item">
            <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Contraseña"
              [(ngModel)]="credenciales.password"
              name="password"
              required>
            </ion-input>
            <ion-button 
              fill="clear" 
              slot="end" 
              class="password-toggle" 
              (click)="togglePassword()"
              type="button">
              <ion-icon 
                slot="icon-only"
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
              </ion-icon>
            </ion-button>
          </ion-item>
        </div>

        <div class="actions-row">
          <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <ion-button 
          type="submit" 
          expand="block" 
          class="login-btn" 
          [disabled]="cargando || cargandoGoogle">
          @if (cargando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Ingresar
          }
        </ion-button>

      </form>

      <div class="divider" aria-hidden="true">
        <span>o</span>
      </div>

      <ion-button 
        type="button" 
        expand="block" 
        class="google-btn" 
        [disabled]="cargando || cargandoGoogle"
        (click)="iniciarConGoogle()">
        @if (cargandoGoogle) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <svg slot="start" class="google-logo" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
          </svg>
          Continuar con Google
        }
      </ion-button>

      <div class="register-container">
        <span class="register-text">¿No tienes una cuenta?</span>
        <ion-button 
          fill="outline" 
          expand="block" 
          class="register-btn" 
          routerLink="/register">
          Crear cuenta
        </ion-button>
      </div>
    </div>

  </div>
</ion-content>
