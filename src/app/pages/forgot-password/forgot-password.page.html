<!-- Cabecera y Toolbar -->
<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" routerLink="/login" class="custom-back-btn fade-in">
        <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
        Volver
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    
    <!-- Encabezado -->
    <div class="header-section fade-in">
      <div class="brand-container">
        <ion-icon name="key-outline" class="brand-icon"></ion-icon>
      </div>
      <h1 class="brand-title">Recuperar Contraseña</h1>
      <p class="brand-subtitle">Ingresa tu correo y te enviaremos un enlace seguro para restablecerla.</p>
    </div>

    <!-- Tarjeta del Formulario -->
    <div class="form-container fade-in">
      <form (ngSubmit)="recuperarPassword()">
        
        <div class="input-group">
          <ion-item lines="none" class="custom-input-item">
            <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
            <ion-input
              type="email"
              placeholder="Correo electrónico"
              [(ngModel)]="correo"
              name="correo"
              required>
            </ion-input>
          </ion-item>
        </div>

        <ion-button 
          type="submit" 
          expand="block" 
          class="login-btn" 
          [disabled]="cargando">
          @if (cargando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Enviar enlace
          }
        </ion-button>

      </form>
    </div>

  </div>
</ion-content>
