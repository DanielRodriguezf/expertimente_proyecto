<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    
    <div class="header-section fade-in">
      <div class="brand-container">
        <img src="assets/" alt="" class="brand-logo">
        <h1 class="brand-title">ExpertiMente</h1>
      </div>
      <p class="brand-subtitle">Inicia sesión para continuar</p>
    </div>

    <div class="form-container fade-in">
      <form (ngSubmit)="iniciarSesion()">
        
        <div class="input-group">
          <ion-item lines="none" class="custom-input-item">
            <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
            <ion-input
              type="email"
              placeholder="Correo electrónico"
              [(ngModel)]="credenciales.correo"
              name="correo"
              required>
            </ion-input>
          </ion-item>
        </div>

        <div class="input-group">
          <ion-item lines="none" class="custom-input-item">
            <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Contraseña"
              [(ngModel)]="credenciales.password"
              name="password"
              required>
            </ion-input>
            <ion-button 
              fill="clear" 
              slot="end" 
              class="password-toggle" 
              (click)="togglePassword()"
              type="button">
              <ion-icon 
                slot="icon-only"
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
              </ion-icon>
            </ion-button>
          </ion-item>
        </div>

        <div class="actions-row">
          <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <ion-button 
          type="submit" 
          expand="block" 
          class="login-btn" 
          [disabled]="cargando">
          @if (cargando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Ingresar
          }
        </ion-button>

      </form>

      <div class="register-container">
        <span class="register-text">¿No tienes una cuenta?</span>
        <ion-button 
          fill="outline" 
          expand="block" 
          class="register-btn" 
          routerLink="/register">
          Crear cuenta
        </ion-button>
      </div>
    </div>

  </div>
</ion-content>
